<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header with Small Logo</title>
    <style>
        /* --- CSS for Styling --- */
        .header {
            background-color: #f8f8f8; /* Light gray background for the header */
            padding: 10px 20px;
            border-bottom: 1px solid #eee;
            display: flex; /* Allows content to be aligned horizontally */
            align-items: center; /* Vertically centers the logo and text */
        }

        .logo-img {
            /* Set the size for the small logo */
            height: 40px; /* Adjust as needed */
            width: auto; /* Maintains aspect ratio */
            margin-right: 15px; /* Adds space between the logo and other content */
        }

        .site-title {
            font-family: Arial, sans-serif;
            font-size: 1.5em;
            color: #333;
            margin: 0; /* Remove default margin */
        }
    </style>
</head>
<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img src="/img/logo.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
            Bootstrap
          </a>
        </div>
      </nav>

    </body>
</html>
